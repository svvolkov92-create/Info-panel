name: desktop_panel
description: Информационная панель для рабочего стола Windows.
publish_to: none
version: 2.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.1
  screen_retriever: any
  ffi: ^2.1.0
  tray_manager: ">=0.2.3 <0.6.0"
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
