name: Flutter prototype

on:
  push:
    branches: [main]
    paths: ["flutter_proto/**", ".github/workflows/flutter-proto.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_proto
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build web
        run: |
          flutter --version | tee build.log
          flutter create --platforms=web,windows --project-name info_panel_proto . 2>&1 | tail -3 | tee -a build.log
          rm -f test/widget_test.dart
          set -o pipefail
          flutter build web --release --no-web-resources-cdn 2>&1 | tee -a build.log
          sed -i 's|<base href="/">|<base href="./">|' build/web/index.html
      - name: Publish build to proto-web branch
        run: |
          cd build/web
          rm -f flutter_service_worker.js
          git init -q -b proto-web
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "web build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" proto-web
      - name: Save log
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/web.log
          cd /tmp/log && git init -q -b ci-logs-web && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm log
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-web

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_proto
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows
        run: |
          flutter create --platforms=web,windows --project-name info_panel_proto . > build.log 2>&1
          rm -f test/widget_test.dart
          set -o pipefail
          flutter build windows --release 2>&1 | tee -a build.log
      - uses: actions/upload-artifact@v4
        with:
          name: InfoPanel-Flutter-Windows
          path: flutter_proto/build/windows/x64/runner/Release/
      - name: Save log
        if: always()
        run: |
          mkdir -p ../wlog && cp build.log ../wlog/windows.log
          cd ../wlog && git init -q -b ci-logs-win && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm log
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-win
